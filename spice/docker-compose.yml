services:
  db:
    image: mariadb:10.11
    container_name: spice_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: spice_db
      MARIADB_USER: spice_user
      MARIADB_PASSWORD: spice_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend-dotnet
    container_name: spice_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # activeaza Swagger
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=spice_db;User=spice_user;Password=spice_password;"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
        REACT_APP_API_URL: http://localhost:5000
    container_name: spice_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
